name: Build blog from CMS sources

on:
  push:
    branches: [main]
    paths:
      - "cms/**"
      - "scripts/build_blog.py"
      - "scripts/blog_template.html"
      - "scripts/blog_template_ru.html"
      - "scripts/blog_template_fr.html"
      - "scripts/align_seo_meta.py"
      - "scripts/add_favicon.py"
      - "app/favicon.svg"
      - "app/site.webmanifest"
      - "scripts/build_md_twins.py"
      - "scripts/update_csp_hashes.py"
      - "scripts/build_sitemap.py"
      - "scripts/check_seo_invariants.py"
      - "scripts/sync_pricing_answer.py"
      - "scripts/build_locale_pages.py"
      - "scripts/localize_homepage_cards.py"
      - "scripts/fix_locale_links.py"
      - "scripts/clean_internal_urls.py"
      - "scripts/audit_link_graph.py"
      - "scripts/blog_index_template_ru.html"
      - "scripts/blog_index_template_fr.html"
      - "scripts/blog_index_template.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build blog pages
        run: python3 scripts/build_blog.py

      - name: Build locale pages (if translation maps present)
        run: python3 scripts/build_locale_pages.py

      # Pages outside build_locale_pages' PAGES list have no rebuild path, so a
      # new English sentence never reaches them. This applies the same maps as a
      # safety net; it can only match text that is still English.
      - name: Translate leftover English in static locale twins
        run: python3 scripts/localize_leftovers.py

      - name: Localize homepage cards (carousel EN names + localized blog cards)
        run: python3 scripts/localize_homepage_cards.py

      - name: Rewrite locale links to localized twins (must run after every rebuild)
        run: python3 scripts/fix_locale_links.py

      - name: Clean internal URLs to canonical (extensionless) form
        run: python3 scripts/clean_internal_urls.py

      # /pricing is the source of truth: derive the homepage fee cards
      # from scripts/fees_data.py so the two can never show different numbers.
      - name: Sync homepage fees to pricing
        run: python3 scripts/sync_home_fees.py

      # /pricing carries the one-sentence total ("from $17,210") that the AI
      # Overview was missing a citation for; render it from fees_data.py too.
      - name: Render the answer-first cost block on /pricing
        run: python3 scripts/sync_pricing_answer.py
      - name: Align SEO meta (canonical/hreflang/og/perf)
        run: python3 scripts/align_seo_meta.py

      # The 404 is shared design, not CMS content: render it from
      # scripts/pages/404.src.html so a publish can never drop its hero.
      - name: Render the 404 page
        run: python3 scripts/build_404.py
      - name: Square favicon set on every page (root-absolute, idempotent)
        run: python3 scripts/add_favicon.py

      - name: Install markdown-twin deps
        run: pip install beautifulsoup4 lxml

      - name: Build markdown twins (Markdown for Agents content negotiation)
        run: python3 scripts/build_md_twins.py

      - name: Regenerate CSP hashes + middleware (keep inline-script hashes in sync)
        run: python3 scripts/update_csp_hashes.py

      - name: Build sitemap
        run: python3 scripts/build_sitemap.py

      - name: Check SEO invariants
        run: python3 scripts/check_seo_invariants.py

      - name: Link graph gate (dead links + locale leaks block the build)
        run: python3 scripts/audit_link_graph.py --fail-on-issue

      - name: Commit generated files
        run: |
          git config user.name "bicelin"
          git config user.email "bicelin@users.noreply.github.com"
          git add app/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(blog): rebuild static pages from cms/ sources"
            # Two pushes can land at once (a human commit and this rebuild, or two
            # agents). Rebase onto whatever landed first and retry instead of
            # failing the run and silently leaving the site on the old build.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                exit 0
              fi
              echo "::warning::push race on attempt $attempt; retrying after rebase"
              sleep 5
            done
            echo "::error::could not push the rebuilt pages after 3 attempts"
            exit 1
          fi
