<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>RealtimeKit pilot — default meeting UI</title>
    <!--
      Local pilot page, straight from the RealtimeKit quickstart (Web Components).
      It is NOT part of the site: nothing links to it and the site's CSP does not
      allow jsdelivr, so run it from this folder instead:

        python3 -m http.server 8788 --directory scripts/rtk-pilot
        # then, with a token from our own backend:
        open "http://localhost:8788/?authToken=<authToken>"

      Get <authToken> server-side (never in the browser):
        curl -s -X POST https://visa2.au/api/realtime-token \
          -H 'content-type: application/json' \
          -d '{"name":"Sergey","passcode":"<lobby passcode>"}'
      That returns meetingId, preset, authToken — recording on, transcripts on,
      and the file destined for our own R2 bucket.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      rtk-meeting { display: block; height: 100%; }
      #missing { color: #fff; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
      #status {
        position: fixed; left: 12px; bottom: 12px; z-index: 10;
        color: #fff; background: rgba(0,0,0,.72); border: 1px solid #444;
        border-radius: 6px; padding: 6px 10px;
        font: 12px/1.4 ui-monospace, monospace; max-width: 70ch;
      }
    </style>
  </head>
  <body>
    <div id="status">starting…</div>
    <div id="missing" hidden>
      No authToken in the URL. Append <code>?authToken=&lt;token&gt;</code> — see the
      comment at the top of this file.
    </div>

    <!-- No show-setup-screen: init() already connects, and the setup screen added a
         second join step that landed on "You left the meeting." with no preview. -->
    <rtk-meeting id="my-meeting"></rtk-meeting>

    <!-- UI Kit components + Core SDK, exactly as the quickstart loads them.
         @latest is fine for a pilot; pin versions before production. -->
    <script type="module">
      import { defineCustomElements } from "https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit-ui@latest/loader/index.es2017.js";
      defineCustomElements();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit@latest/dist/browser.js"></script>

    <script>
      // Accept ?authToken= (as the quickstart does) or #authToken= — the hash
      // never leaves the browser, so tokens stay out of any server log.
      const q = new URL(window.location.href).searchParams.get("authToken");
      const h = new URLSearchParams(window.location.hash.replace(/^#/, "")).get("authToken");
      const authToken = q || h;
      const el = document.getElementById("my-meeting");
      // The UI Kit's loader upgrades <rtk-meeting> asynchronously. Setting .meeting
      // before that upgrade is silently discarded (Stencil has no setter yet), which
      // leaves the element spinning with no self-view — so wait for the upgrade.
      const uiReady = customElements.whenDefined("rtk-meeting");
      const setStatus = (msg) => {
        const s = document.getElementById("status");
        if (s) s.textContent = msg;
        console.log("rtk-pilot:", msg);
      };

      if (!authToken) {
        document.getElementById("missing").hidden = false;
        el.hidden = true;
        setStatus("no authToken in the URL");
      } else {
        // A pixel-perfect diagnostic path: every step lands on screen, so a
        // screenshot answers "why is there no video" without DevTools.
        setStatus("token ok (" + authToken.length + " chars) — connecting…");
        RealtimeKitClient.init({ authToken })
          .then(async (meeting) => {
            const id = meeting.meta?.meetingId ?? "(unknown)";
            setStatus("joined " + String(id).slice(0, 8) + " as " + (meeting.self?.name || "?") + " — waiting for the UI kit");
            await uiReady;
            el.meeting = meeting;
            // The kit keeps its own reference; if it re-renders without the property,
            // put it back. (Do not try to detect "rendered" by selector — the kit's
            // internal element names are not API surface, and guessing them produced
            // a false "still empty" alarm while the room was in fact fully rendered.)
            for (const ms of [400, 1500]) {
              setTimeout(() => {
                if (el.meeting !== meeting) el.meeting = meeting;
              }, ms);
            }
            el.addEventListener("rtkMeetingLeft", () =>
              setStatus("left the meeting — reload this tab to rejoin"),
            );
            try {
              meeting.self?.on("videoUpdate", (v) => setStatus("video " + (v ? "on" : "off")));
              meeting.self?.on("audioUpdate", (a) => setStatus("audio " + (a ? "on" : "off")));
            } catch (e) {
              setStatus("joined; live media events unavailable: " + e.message);
            }
          })
          .catch((err) => {
            document.getElementById("missing").hidden = false;
            document.getElementById("missing").textContent = "Could not join: " + (err?.message || err);
            el.hidden = true;
            setStatus("init failed: " + (err?.message || err));
          });
      }
    </script>
  </body>
</html>
